<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- ไอคอนรากฟันเทียม — ผู้ใช้เลือกแบบ 31 ส.ค. 2569
       สัดส่วนตามภาพอ้างอิง: ครอบฟันใหญ่ด้านบน (มี abutment เล็กอยู่ข้างใน)
       เส้นเหงือกผ่ากลาง แล้วสกรูเกลียวอยู่ใต้เหงือกล้วนๆ -->
  <rect width="512" height="512" rx="112" fill="#2B5CE6"/>
  <g fill="none" stroke="#fff" stroke-width="19" stroke-linecap="round" stroke-linejoin="round">
    <!-- ครอบฟัน: กว้าง สองยอด แอ่งตรงกลาง ปลายสอบลงถึงคอ -->
    <path d="M186 262
             C168 216 166 164 186 138
             C202 118 228 118 246 128
             C252 131 260 131 266 128
             C284 118 310 118 326 138
             C346 164 344 216 326 262"/>
    <!-- abutment เล็กในครอบ -->
    <path d="M238 150 h36 l7 52 h-50 z"/>
    <!-- เส้นเหงือก: จากขอบ โค้งขึ้นแตะโคนครอบ แล้วลงมาบรรจบสกรู -->
    <path d="M64 288 C118 288 142 262 186 262 M448 288 C394 288 370 262 326 262"/>
    <!-- สกรู: เริ่มใต้แนวเหงือก -->
    <path d="M226 266 h60 v118 l-30 32 -30-32 z"/>
    <path d="M226 306 l60-14 M226 342 l60-14 M226 378 l60-14"/>
  </g>
</svg>
