<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- ไอคอนรากฟันเทียม ตามภาพอ้างอิงของผู้ใช้ (31 ส.ค. 2569):
       เส้นสีฟ้าบางบนพื้นขาว — ครอบฟันยอดหยัก · abutment · เส้นเหงือก · สกรูเกลียว -->
  <rect width="512" height="512" rx="112" fill="#ffffff"/>
  <g fill="none" stroke="#1B7CB8" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <!-- ครอบฟัน: ข้างป่อง คอดเข้าที่ฐาน ยอดบนหยักมีแอ่งกลาง -->
    <!-- ครอบฟันทรงกราม: ข้างเกือบตรง ยอดหยักตื้นๆ สองพู
         (รอบก่อนแอ่งกลางลึก+ข้างป่อง เลยดูเป็นหัวใจ) -->
    <path d="M208 270
             C190 246 178 206 181 164
             C184 134 202 114 230 114
             C242 114 248 124 256 124
             C264 124 270 114 282 114
             C310 114 328 134 331 164
             C334 206 322 246 304 270"/>
    <!-- abutment ในครอบ ผายลงถึงแนวเหงือก -->
    <path d="M240 170 h32 l10 82 h-52 z"/>
    <!-- เส้นเหงือกสองข้าง โค้งเข้าหาคอฟัน -->
    <path d="M62 298 C116 298 138 267 178 266 M450 298 C396 298 374 267 334 266"/>
    <!-- ตัวสกรู + ปลายแหลม -->
    <path d="M228 272 h56 v112 l-28 30 -28-30 z"/>
    <!-- เกลียว 3 เส้น -->
    <path d="M228 312 l56-14 M228 348 l56-14 M228 384 l56-14"/>
  </g>
</svg>
