<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- โลโก้ขนาดเล็ก (แถบซ้ายหน้าอาจารย์ ~30px)
       ไอคอนหลัก icon.svg เส้นหนา 13 บนผืน 512 → ที่ 30px เหลือ ~0.8px + พื้นขาวบนแถบขาว
       = แทบมองไม่เห็น (ผู้ใช้แจ้ง 2 ก.ย.) เวอร์ชันนี้จึงกลับสี: พื้นน้ำเงินทึบ เส้นขาวหนาขึ้น
       และตัดรายละเอียดเล็ก (เกลียว 3 เส้น) ออกให้อ่านออกที่ขนาดเล็ก -->
  <rect width="512" height="512" rx="120" fill="#1B7CB8"/>
  <g fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <!-- ครอบฟัน -->
    <path d="M196 268
             C178 244 166 206 169 166
             C172 138 190 119 218 119
             C231 119 238 129 256 129
             C274 129 281 119 294 119
             C322 119 340 138 343 166
             C346 206 334 244 316 268"/>
    <!-- เส้นเหงือก -->
    <path d="M74 300 C120 300 142 272 174 271 M438 300 C392 300 370 272 338 271"/>
    <!-- สกรู + ปลายแหลม -->
    <path d="M222 276 h68 v106 l-34 32 -34-32 z"/>
    <!-- เกลียว 2 เส้น (ตัดจาก 3 ให้โปร่งขึ้น) -->
    <path d="M228 318 l56-14 M228 358 l56-14"/>
  </g>
</svg>
